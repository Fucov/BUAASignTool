<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUAA Course Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <!-- 核心左侧导航区 -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1 class="logo">Sign.</h1>
                <span class="logo-sub" id="lblLogoSub">极简 · 高效</span>
                <div class="lang-switch" onclick="app.toggleLang()">
                    <span id="langBtn">EN</span>
                </div>
            </header>

            <div class="sidebar-content">
                <!-- 网络模式配置器 -->
                <div class="segment-control" id="networkSegment">
                    <button class="seg-btn active" onclick="app.switchMode('direct')" id="segDirect">校园直连</button>
                    <button class="seg-btn" onclick="app.switchMode('vpn')" id="segVpn">校外网络</button>
                </div>

                <!-- 认证区块 -->
                <section class="panel" id="loginPanel">
                    <!-- 校园直连：学号 -->
                    <div id="directInputArea">
                        <label class="field-label" id="lblUid">学号</label>
                        <input type="text" id="studentId" class="input" placeholder="输入学号" autocomplete="off">
                    </div>

                    <!-- VPN 模式：账号密码 -->
                    <div id="vpnInputArea" style="display: none;">
                        <label class="field-label" id="lblVpnUid">账号</label>
                        <input type="text" id="vpnUsername" class="input" placeholder="统一认证账号" autocomplete="off">

                        <label class="field-label" style="margin-top: 12px;" id="lblVpnPwd">密码</label>
                        <input type="password" id="vpnPassword" class="input" placeholder="统一认证密码" autocomplete="off">

                        <!-- 隐藏的学号输入（用于替签测试，不显示标签） -->
                        <input type="text" id="studentIdProxy" class="input" style="margin-top: 8px; display: none;" placeholder="学号（可选）" autocomplete="off">
                    </div>

                    <label class="field-label" style="margin-top: 16px;" id="lblSemester">学期基准日</label>
                    <div class="date-row">
                        <input type="number" id="yearInput" class="input input-sm" value="2026" min="2020" max="2030">
                        <span class="date-sep">/</span>
                        <input type="number" id="monthInput" class="input input-sm" value="3" min="1" max="12">
                        <span class="date-sep">/</span>
                        <input type="number" id="dayInput" class="input input-sm" value="2" min="1" max="31">
                    </div>

                    <button class="btn btn-primary" id="loginBtn" onclick="app.login()">
                        登 录
                    </button>
                    <button class="btn btn-ghost" id="logoutBtn" onclick="app.logout()" style="display:none; margin-top:8px;">
                        退出登录
                    </button>
                    <div id="loginStatus" class="status-text"></div>
                </section>

                <!-- 周导航与控制中心 -->
                <section class="panel" id="weekPanel" style="display:none;">
                    <label class="field-label" id="lblTimeCtrl">时间控制</label>
                    <div class="week-nav">
                        <button class="btn-icon" onclick="app.prevWeek()">‹</button>
                        <span class="week-display" id="weekDisplay">第 1 周</span>
                        <button class="btn-icon" onclick="app.nextWeek()">›</button>
                    </div>
                    <div class="action-row">
                        <button class="btn btn-ghost" onclick="app.jumpToCurrentWeek()" id="btnReset">本周</button>
                        <button class="btn btn-ghost" onclick="app.loadWeek()" id="btnReload">刷新</button>
                    </div>
                    <button class="btn btn-primary btn-dark" style="margin-top: 12px; background: #000;" id="btnBatch" onclick="app.batchSign()">
                        一键签到
                    </button>
                </section>

                <!-- 极简数据板 -->
                <section class="panel stats-panel" id="statsPanel" style="display:none;">
                    <div class="stat-item">
                        <span class="stat-value" id="totalCourses">0</span>
                        <span class="stat-label" id="lblStatBlocks">排课数</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="signedCourses">0</span>
                        <span class="stat-label" id="lblStatDone">已签到</span>
                    </div>
                </section>
            </div>
        </aside>

        <!-- 数据展呈主视窗 -->
        <main class="content">
            <!-- Loading -->
            <div class="loading-overlay" id="loadingOverlay" style="display:none;">
                <div class="loading-spinner"></div>
            </div>

            <!-- 空白态 -->
            <div class="welcome" id="welcomeView">
                <div class="welcome-inner">
                    <h2 style="font-size: 24px; font-weight: 600; color: #000;" id="lblWelcomeTitle">Minimalism Sign.</h2>
                    <p style="margin-top: 4px; color: #555; font-size: 11px; letter-spacing: 1.5px;" id="lblWelcomeSub">等待用户鉴权</p>
                </div>
            </div>

            <!-- 数据网格 -->
            <div class="schedule" id="scheduleView" style="display:none;">
                <div class="schedule-grid" id="scheduleGrid"></div>
            </div>

            <!-- 底部日志台 -->
            <div class="log-tray">
                <div class="log-tray-header" onclick="app.toggleLog()">
                    <span id="logLatest">系统准备就绪。</span>
                    <span class="log-toggle-icon">^</span>
                </div>
                <div class="log-tray-body" id="logBody" style="display: none;"></div>
            </div>
        </main>
    </div>

    <!-- 浮窗 -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
